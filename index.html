!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZENAI 命盘 // 八字能量指南</title>

  <!-- 引入 marked.js 库解析 Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d11;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #16161e;
      border: 1px solid #2a2a3c;
      border-radius: 12px;
      padding: 30px;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      color: #9d7cd8;
      font-size: 24px;
      margin-bottom: 8px;
      text-align: center;
    }
    p.subtitle {
      color: #787c99;
      font-size: 14px;
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .form-group.full-width {
      grid-template-columns: 1fr;
    }
    label {
      font-size: 12px;
      color: #7aa5f7;
      margin-bottom: 4px;
      display: block;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      background: #1a1b26;
      border: 1px solid #2f334d;
      border-radius: 6px;
      color: #c0caf5;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #7aa5f7;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #7aa5f7 0%, #9d7cd8 100%);
      border: none;
      border-radius: 6px;
      color: #15161e;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      background: #414868;
      cursor: not-allowed;
    }

    /* Markdown 结果区域样式 */
    #result-container {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #2f334d;
      line-height: 1.6;
      font-size: 15px;
      color: #c0caf5;
    }
    #result-container h1, #result-container h2, #result-container h3 {
      color: #bb9af7;
      margin-top: 16px;
      margin-bottom: 8px;
      text-align: left;
    }
    #result-container h2 {
      font-size: 18px;
      border-bottom: 1px dashed #2f334d;
      padding-bottom: 4px;
    }
    #result-container h3 {
      font-size: 16px;
    }
    #result-container p {
      margin-bottom: 12px;
    }
    #result-container ul, #result-container ol {
      margin-left: 20px;
      margin-bottom: 12px;
    }
    #result-container li {
      margin-bottom: 4px;
    }
    #result-container strong {
      color: #7aa5f7;
    }
    .loading {
      text-align: center;
      color: #e0af68;
      font-style: italic;
    }
    .error {
      color: #f7768e;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ZENAI 命盘指南</h1>
    <p class="subtitle">输入生辰八字，获取 AI 深度运势能量解析</p >

    <form id="bazi-form">
      <div class="form-group">
        <div>
          <label>出生年份 (公历)</label>
          <input type="number" id="year" placeholder="1995" required value="1995">
        </div>
        <div>
          <label>出生月份</label>
          <input type="number" id="month" min="1" max="12" placeholder="8" required value="8">
        </div>
      </div>

      <div class="form-group">
        <div>
          <label>出生日期</label>
          <input type="number" id="day" min="1" max="31" placeholder="18" required value="18">
        </div>
        <div>
          <label>出生小时 (0-23)</label>
          <input type="number" id="hour" min="0" max="23" placeholder="14" required value="14">
        </div>
      </div>

      <div class="form-group full-width">
        <div>
          <label>性别</label>
          <select id="gender">
            <option value="male">男 (乾造)</option>
            <option value="female">女 (坤造)</option>
          </select>
        </div>
      </div>

      <button type="submit" id="submit-btn">生成八字守护指南</button>
    </form>

    <div id="result-container" style="display: none;"></div>
  </div>

  <script>
    const form = document.getElementById('bazi-form');
    const submitBtn = document.getElementById('submit-btn');
    const resultContainer = document.getElementById('result-container');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // 禁用按钮并显示加载中状态
      submitBtn.disabled = true;
      submitBtn.innerText = "AI 正在解盘推算中...";
      resultContainer.style.display = 'block';
      resultContainer.className = 'loading';
      resultContainer.innerText = "🔮 正在排盘并调用 AI 模型生成指南，请稍候...";

      const payload = {
        year: parseInt(document.getElementById('year').value),
        month: parseInt(document.getElementById('month').value),
        day: parseInt(document.getElementById('day').value),
        hour: parseInt(document.getElementById('hour').value),
        gender: document.getElementById('gender').value
      };

      try {
        const response = await fetch('/api/bazi/guidance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok) {
          resultContainer.className = '';
          const rawText = data.guidance || data.message || "未能生成有效运势内容。";
          // 使用 marked.parse 将 Markdown 字符串渲染成 HTML
          resultContainer.innerHTML = marked.parse(rawText);
        } else {
          resultContainer.className = 'error';
          resultContainer.innerText = `错误: ${data.detail || '请求服务失败'}`;
        }
      } catch (err) {
        resultContainer.className = 'error';
        resultContainer.innerText = `网络异常: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "生成八字守护指南";
      }
    });
  </script>
</body>
</html>
