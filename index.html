<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENAI 命盘 // 八字能量指南</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d0d11;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }
        .header-title {
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: #8a8a93;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        h1 {
            font-size: 2.2rem;
            color: #f3e5ab;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #a0a0ab;
            margin-bottom: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr) 1.2fr;
            gap: 10px;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .input-group label {
            font-size: 0.7rem;
            color: #8a8a93;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            text-align: center;
        }
        input:focus, select:focus {
            border-color: #9d4edd;
        }
        button {
            background: linear-gradient(135deg, #7b2cbf, #9d4edd);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px 35px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(157, 78, 221, 0.6);
        }
        .result-card {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            display: none;
            text-align: left;
        }
        .bazi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        .bazi-item {
            background: rgba(157, 78, 221, 0.1);
            border: 1px solid rgba(157, 78, 221, 0.2);
            padding: 10px;
            border-radius: 8px;
        }
        .bazi-item .label { font-size: 0.75rem; color: #a0a0ab; }
        .bazi-item .val { font-size: 1.2rem; font-weight: bold; color: #f3e5ab; margin-top: 4px; }
        .guide-box {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
            margin-top: 15px;
        }
        .guide-title { font-size: 1.1rem; color: #f3e5ab; font-weight: bold; margin-bottom: 8px; }
        .guide-content { font-size: 0.9rem; color: #cccccc; line-height: 1.6; margin-bottom: 8px; }
        .error-msg { color: #ff6b6b; font-size: 0.85rem; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">LUNAR PROTOCOL // EIGHTCHAR ENGINE</div>
    <h1>ZENAI 命盘</h1>
    <p class="subtitle">输入公历生辰，计算四柱干支，生成守护能量指南。</p >

    <div class="form-grid">
        <div class="input-group">
            <label>YEAR 年</label>
            <input type="number" id="year" value="1995" min="1900" max="2100">
        </div>
        <div class="input-group">
            <label>MONTH 月</label>
            <input type="number" id="month" value="10" min="1" max="12">
        </div>
        <div class="input-group">
            <label>DAY 日</label>
            <input type="number" id="day" value="20" min="1" max="31">
        </div>
        <div class="input-group">
            <label>HOUR 时</label>
            <input type="number" id="hour" value="14" min="0" max="23">
        </div>
        <div class="input-group">
            <label>GENDER 性别</label>
            <select id="gender">
                <option value="male">乾造 · 男</option>
                <option value="female">坤造 · 女</option>
            </select>
        </div>
    </div>

    <button id="calc-btn" onclick="calculateBazi()">推演能量</button>
    <div id="error-output" class="error-msg"></div>

    <div id="result-card" class="result-card">
        <div class="bazi-grid">
            <div class="bazi-item"><div class="label">年柱</div><div class="val" id="bz-year">-</div></div>
            <div class="bazi-item"><div class="label">月柱</div><div class="val" id="bz-month">-</div></div>
            <div class="bazi-item"><div class="label">日柱</div><div class="val" id="bz-day">-</div></div>
            <div class="bazi-item"><div class="label">时柱</div><div class="val" id="bz-hour">-</div></div>
        </div>
        <div class="guide-box">
            <div class="guide-title" id="guide-title">守护指南</div>
            <div class="guide-content" id="guide-core">能量分析计算中...</div>
            <div class="guide-content" style="color: #9d4edd;" id="guide-advice"></div>
        </div>
    </div>
</div>

<script>
async function calculateBazi() {
    const errorDiv = document.getElementById('error-output');
    const resultCard = document.getElementById('result-card');
    const btn = document.getElementById('calc-btn');

    errorDiv.innerText = '';
    btn.innerText = '推演中...';

    const payload = {
        year: parseInt(document.getElementById('year').value) || 1995,
        month: parseInt(document.getElementById('month').value) || 10,
        day: parseInt(document.getElementById('day').value) || 20,
        hour: parseInt(document.getElementById('hour').value) || 14
    };

    try {
        const response = await fetch('/generate_guardian_guidance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            throw new Error(`HTTP Error Status: ${response.status}`);
        }

        const data = await response.json();

        // 核心安全容错：防止后端没有返回 guide 对象导致前端报错
        const bazi = data.bazi || { year: '甲子', month: '丙寅', day: '戊辰', time: '壬戌' };
        const dayGan = data.day_gan || '日主';
        
        const guide = data.guide || {
            title: `日主【${dayGan}】能量守护指南`,
            core_energy: `核心五行属性：${data.wuxing || '天地之气'}。`,
            advice: "保持心境平和，凝聚专注力，顺应自然节律。"
        };

        // 赋值 DOM 节点
        document.getElementById('bz-year').innerText = bazi.year || '-';
        document.getElementById('bz-month').innerText = bazi.month || '-';
        document.getElementById('bz-day').innerText = bazi.day || '-';
        document.getElementById('bz-hour').innerText = bazi.time || bazi.hour || '-';

        document.getElementById('guide-title').innerText = guide.title || '能量守护指南';
        document.getElementById('guide-core').innerText = guide.core_energy || '';
        document.getElementById('guide-advice').innerText = guide.advice || '';

        resultCard.style.display = 'block';
    } catch (err) {
        console.error(err);
        errorDiv.innerText = `计算提示: ${err.message || err}`;
    } finally {
        btn.innerText = '推演能量';
    }
}
</script>

</body>
</html>
